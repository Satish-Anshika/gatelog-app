<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - GateLog</title>
    <meta name="description" content="GateLog Student Dashboard – view and collect your parcels at the gate.">
    <link rel="stylesheet" href="css/style.css">
    <!-- 1D Barcode renderer (JsBarcode / CODE128) -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- QR Code renderer (pure SVG, no canvas duplication) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Gate<span>Log</span></div>
        <div class="nav-links">
            <a href="lost-found.html">Lost & Found</a>
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </nav>
    <div class="dashboard-container">
        
        <div class="mb-3">
            <h2>Welcome, <span id="student-name" class="golden-text">Student</span></h2>
            <p class="text-muted">Here are your pending parcels at the gates.</p>
        </div>

        <div id="student-parcels" class="grid">
            <!-- Dynamically populated -->
        </div>

        <h2 class="mt-3 mb-2">Collection History</h2>
        <div id="student-history" class="grid">
            <!-- Dynamically populated -->
        </div>

    </div>
    <script type="module" src="js/student.js"></script>
</body>
</html>
