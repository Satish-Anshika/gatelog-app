<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard - GateLog</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Fast ZXing Multi-Format (QR & Barcode) Scanner -->
    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <!-- Fallback Html5Qrcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Gate<span>Log</span> Security</div>
        <div class="nav-links">
            <a href="lost-found.html">Lost & Found</a>
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </nav>
    <div class="dashboard-container">
        
        <div class="grid">
            <!-- Add Parcel Section -->
            <div class="card glass-panel" style="grid-column: span 1;">
                <h2 class="golden-text mb-2">Log New Parcel</h2>
                <form id="add-parcel-form">
                    <div id="parcel-msg" class="alert hidden"></div>
                    
                    <div class="form-group">
                        <label>Student Phone Number</label>
                        <input type="text" id="parcel-phone" class="form-control" required placeholder="User's unique phone">
                    </div>
                    <div class="form-group">
                        <label>Student Name</label>
                        <input type="text" id="parcel-name" class="form-control" required placeholder="For verification">
                    </div>
                    <div class="form-group">
                        <label>Gate Assignment</label>
                        <select id="parcel-gate" class="form-control" required>
                            <option value="Gate 1">Gate 1</option>
                            <option value="Gate 2">Gate 2</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Add Parcel</button>
                </form>
            </div>

            <!-- Verify Pickup Section -->
            <div class="card glass-panel" style="grid-column: span 1;">
                <div class="flex justify-between align-center mb-2">
                    <h2 class="golden-text" style="margin: 0;">Verify Pickup</h2>
                    <button type="button" id="toggle-camera-btn" class="btn-outline btn-sm">📷 Scan Camera</button>
                </div>
                
                <div id="scanner-container" class="hidden mb-2">
                    <div style="position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: #000;">
                        <video id="scanner-video" style="width: 100%; height: 260px; object-fit: cover; display: block; border-radius: 8px;"></video>
                        <div id="qr-reader" style="width: 100%; display: none;"></div>
                        <div class="scanner-laser-line"></div>
                    </div>
                    <button type="button" id="stop-camera-btn" class="btn-outline btn-sm w-100 mt-2" style="justify-content: center;">✕ Close Camera</button>
                </div>

                <form id="verify-parcel-form">
                    <div class="form-group">
                        <label>Scan Barcode or Enter ID</label>
                        <input type="text" id="verify-barcode" class="form-control" required placeholder="e.g. BAR-123456" autocomplete="off" autofocus>
                        <small class="text-muted" style="display:block; margin-top:0.35rem; font-size:0.8rem;">
                            Auto-verifies upon camera scan, scanner gun, or paste.
                        </small>
                    </div>
                    <button type="submit" class="btn-primary" style="background-color: var(--success); color: #fff;">Verify & Mark as Delivered</button>
                </form>
            </div>
        </div>

        <h2 class="mt-3 mb-2">Pending Parcels at Gates</h2>
        <div id="parcels-list" class="grid">
            <!-- Dynamically populated -->
        </div>

    </div>
    <script type="module" src="js/security.js"></script>
</body>
</html>
